<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Неон-Бич — 3D город</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap">
<style>
:root{--pink:#ff5fa8;--cyan:#5ff0ff;--ink:#12082a;--text:#fff4ff;box-sizing:border-box}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:"Unbounded",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 14px);font-weight:700;text-shadow:0 0 14px var(--pink)}
#hud b{font-size:clamp(40px,11vw,64px);line-height:1}
#hud span{font-size:13px;margin-left:6px;color:var(--cyan)}
#map{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 14px);width:112px;height:112px;border-radius:50%;border:3px solid var(--pink);box-shadow:0 0 18px #ff5fa888;background:#1b1030}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;gap:12px}
.pad.L{left:calc(env(safe-area-inset-left,0px) + 16px)}
.pad.R{right:calc(env(safe-area-inset-right,0px) + 16px)}
.pad button{width:76px;height:76px;border-radius:50%;border:3px solid var(--cyan);background:#12082acc;color:var(--text);font-size:26px;touch-action:none;box-shadow:0 0 16px #5ff0ff66;font-family:inherit}
.pad button.on{background:var(--pink);border-color:#fff;transform:scale(.94)}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(180deg,#12082acc,#7a1f6acc);backdrop-filter:blur(4px);transition:opacity .5s;z-index:10}
#title.hide{opacity:0;pointer-events:none}
h1{font-size:clamp(38px,11vw,72px);margin:0 0 12px;line-height:1.05;background:linear-gradient(180deg,#fff,var(--pink) 60%,#ff9a4d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ff5fa8aa);animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 30px #5ff0ffaa)}}
#title p{max-width:34ch;font-size:14px;line-height:1.6;color:#ffd9f0;margin:0 0 26px;font-weight:500}
#go{font-family:inherit;font-weight:700;font-size:18px;color:#2a0a3a;background:linear-gradient(180deg,#ffe08a,#ff9a4d);border:0;border-radius:99px;padding:18px 44px;cursor:pointer;box-shadow:0 8px 30px #ff9a4d88}
#go:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b id="spd">0</b><span>км/ч</span></div>
<canvas id="map" width="224" height="224"></canvas>
<div class="pad L"><button data-k="l">◀</button><button data-k="r">▶</button></div>
<div class="pad R"><button data-k="b">▼</button><button data-k="g">▲</button></div>
<section id="title">
  <h1>НЕОН-БИЧ</h1>
  <p>Открытый город в духе 80-х: закат, пальмы, неон и океан. Катайся по улицам, объезжай трафик и ищи побережье. Управление: стрелки или WASD, на телефоне кнопки.</p>
  <button id="go">Поехали</button>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var rnd=function(a,b){return a+Math.random()*(b-a)};
var R3=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R3.setPixelRatio(Math.min(devicePixelRatio,2));
var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,1,.5,1700);
function size(){R3.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
scene.fog=new THREE.Fog(0xff8aa8,90,560);

/* небо и солнце */
var sk=document.createElement('canvas');sk.width=4;sk.height=256;
var sg=sk.getContext('2d'),gr=sg.createLinearGradient(0,0,0,256);
[[0,'#160a38'],[.25,'#4a1f7a'],[.42,'#c2407f'],[.5,'#ff8a7a'],[.56,'#ffc27a'],[1,'#ffd98a']].forEach(function(c){gr.addColorStop(c[0],c[1])});
sg.fillStyle=gr;sg.fillRect(0,0,4,256);
var sky=new THREE.Mesh(new THREE.SphereGeometry(1300,16,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sk),side:THREE.BackSide,fog:false}));
scene.add(sky);
var sun=new THREE.Mesh(new THREE.CircleGeometry(90,40),new THREE.MeshBasicMaterial({color:0xffd27a,fog:false}));
sun.position.set(-420,130,-1000);sun.lookAt(0,0,0);sky.add(sun);
var halo=new THREE.Mesh(new THREE.CircleGeometry(170,40),new THREE.MeshBasicMaterial({color:0xff7aa0,transparent:true,opacity:.28,fog:false}));
halo.position.set(-420,130,-1005);halo.lookAt(0,0,0);sky.add(halo);
scene.add(new THREE.HemisphereLight(0xffb0d8,0x2a1450,.95));
var dl=new THREE.DirectionalLight(0xff9a70,.9);dl.position.set(-300,160,-500);scene.add(dl);

/* город */
var N=7,B=70,P=96,HALF=N*P/2;
function rc(j){return (j-N/2)*P}
var boxes=[];
var ground=new THREE.Mesh(new THREE.PlaneGeometry(2600,2600),new THREE.MeshStandardMaterial({color:0x1d1a2b,roughness:.95}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
var sand=new THREE.Mesh(new THREE.PlaneGeometry(130,2600),new THREE.MeshStandardMaterial({color:0xf3cf98,roughness:1}));
sand.rotation.x=-Math.PI/2;sand.position.set(HALF+80,.03,0);scene.add(sand);
var sea=new THREE.Mesh(new THREE.PlaneGeometry(1600,2600),new THREE.MeshStandardMaterial({color:0x2a86d8,roughness:.2,metalness:.3,emissive:0x0a2a5a,emissiveIntensity:.5}));
sea.rotation.x=-Math.PI/2;sea.position.set(HALF+145+800,-.1,0);scene.add(sea);

var dk=document.createElement('canvas');dk.width=64;dk.height=8;
var dg=dk.getContext('2d');dg.fillStyle='#ffe38a';dg.fillRect(0,2,32,4);
var dashT=new THREE.CanvasTexture(dk);dashT.wrapS=THREE.RepeatWrapping;dashT.repeat.set(N*P/14,1);
var dashM=new THREE.MeshBasicMaterial({map:dashT,transparent:true});
for(var j=0;j<=N;j++){
  var a=new THREE.Mesh(new THREE.PlaneGeometry(N*P+30,1.2),dashM);a.rotation.x=-Math.PI/2;a.position.set(0,.06,rc(j));scene.add(a);
  var b=new THREE.Mesh(new THREE.PlaneGeometry(N*P+30,1.2),dashM);b.rotation.x=-Math.PI/2;b.rotation.z=Math.PI/2;b.position.set(rc(j),.07,0);scene.add(b);
}

function winTex(lit){
  var k=document.createElement('canvas');k.width=k.height=64;var g=k.getContext('2d');
  g.fillStyle=lit?'#000':'#fff';g.fillRect(0,0,64,64);
  for(var y=4;y<64;y+=16)for(var x=4;x<64;x+=16){
    if(lit){if(Math.random()<.55){g.fillStyle=Math.random()<.7?'#ffd98a':'#8ae9ff';g.fillRect(x,y,8,10)}}
    else{g.fillStyle='#3b3355';g.fillRect(x,y,8,10)}
  }
  var t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
var WM=winTex(false),WL=[winTex(true),winTex(true),winTex(true)];
var PAL=[0xff6fae,0x6fe3ff,0xffd36f,0xb78cff,0x9effc9,0xf2eaff,0xff9a7a];
var NEON=[0xff3d9a,0x3df0ff,0xffe14d,0xa56bff];
var sw=new THREE.MeshStandardMaterial({color:0x5b5470,roughness:.9});

function tower(x,z,w,d,h){
  var g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv;
  for(var i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*Math.max(w,d)/10,uv.getY(i)*h/10);
  var m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:PAL[Math.floor(Math.random()*PAL.length)],map:WM,emissive:0xffffff,emissiveMap:WL[Math.floor(Math.random()*3)],emissiveIntensity:.9,roughness:.7}));
  m.position.set(x,h/2,z);scene.add(m);
  boxes.push({x:x,z:z,hw:w/2,hd:d/2});
  if(Math.random()<.55){
    var s=new THREE.Mesh(new THREE.BoxGeometry(w*.7,2.2,.5),new THREE.MeshBasicMaterial({color:NEON[Math.floor(Math.random()*4)]}));
    s.position.set(x,Math.min(h*.4,18),z+d/2+.3);scene.add(s);
  }
}
var palms=[];
for(var i=0;i<N;i++)for(var k=0;k<N;k++){
  var cx=(i-(N-1)/2)*P,cz=(k-(N-1)/2)*P;
  var sb=new THREE.Mesh(new THREE.BoxGeometry(B,.5,B),sw);sb.position.set(cx,.25,cz);scene.add(sb);
  var dc=Math.hypot(cx,cz)/HALF;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q){
    if(Math.random()<.1)return;
    var h=rnd(14,32)+(1-dc)*rnd(20,80);
    tower(cx+q[0]*17.5,cz+q[1]*17.5,rnd(20,30),rnd(20,30),h);
  });
  [-20,0,20].forEach(function(o){
    [[B/2-2,o],[-B/2+2,o],[o,B/2-2],[o,-B/2+2]].forEach(function(p){if(Math.random()<.6)palms.push([cx+p[0],cz+p[1]])});
  });
}
/* пальмы (instanced) */
var tm=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.6,8,6),new THREE.MeshStandardMaterial({color:0x8a5a3c}),palms.length);
var lg=new THREE.ConeGeometry(.9,6,3);lg.rotateZ(-Math.PI/2);lg.translate(3,0,0);
var lm=new THREE.InstancedMesh(lg,new THREE.MeshStandardMaterial({color:0x2fd08a,emissive:0x0a3a2a,side:THREE.DoubleSide}),palms.length*5);
var du=new THREE.Object3D();
palms.forEach(function(p,n){
  du.rotation.set(0,0,0);du.position.set(p[0],4.5,p[1]);du.scale.set(1,1,1);du.updateMatrix();tm.setMatrixAt(n,du.matrix);
  for(var l=0;l<5;l++){
    du.position.set(p[0],8.6,p[1]);du.rotation.set(0,l*1.2566+n,-.55,'YZX');du.updateMatrix();lm.setMatrixAt(n*5+l,du.matrix);
  }
});
scene.add(tm);scene.add(lm);

/* машины */
function makeCar(col){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.BoxGeometry(2,.8,4.4),new THREE.MeshStandardMaterial({color:col,roughness:.35,metalness:.5}));body.position.y=.85;g.add(body);
  var cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,.7,2.2),new THREE.MeshStandardMaterial({color:0x1a1530,roughness:.15,metalness:.7}));cab.position.set(0,1.55,-.2);g.add(cab);
  var wm=new THREE.MeshStandardMaterial({color:0x111111}),wg=new THREE.CylinderGeometry(.46,.46,.4,12);wg.rotateZ(Math.PI/2);
  [[-1.05,1.4],[1.05,1.4],[-1.05,-1.4],[1.05,-1.4]].forEach(function(p){var w=new THREE.Mesh(wg,wm);w.position.set(p[0],.46,p[1]);g.add(w)});
  var hm=new THREE.MeshBasicMaterial({color:0xfff2b0}),tl=new THREE.MeshBasicMaterial({color:0xff2a4a});
  [-.7,.7].forEach(function(x){
    var h=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,.1),hm);h.position.set(x,.95,2.22);g.add(h);
    var t=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,.1),tl);t.position.set(x,.95,-2.22);g.add(t);
  });
  var ug=new THREE.Mesh(new THREE.BoxGeometry(1.8,.05,4),new THREE.MeshBasicMaterial({color:0x5ff0ff}));ug.position.y=.3;g.add(ug);
  scene.add(g);return g;
}
var me=makeCar(0xff3d9a),car={x:rc(3),z:0,a:0,v:0,st:0};
var traffic=[],TC=[0xffd36f,0x6fe3ff,0xf2eaff,0x9effc9,0xb78cff,0xff9a7a];
for(var t=0;t<14;t++){
  var ax=Math.random()<.5?'z':'x',dir=Math.random()<.5?1:-1,jj=Math.floor(Math.random()*(N+1));
  traffic.push({m:makeCar(TC[t%6]),ax:ax,dir:dir,j:jj,s:rnd(8,15),p:rnd(-HALF,HALF),x:0,z:0});
}

/* управление */
var K={g:0,b:0,l:0,r:0},started=false,shake=0;
var KM={ArrowUp:'g',w:'g',W:'g',ArrowDown:'b',s:'b',S:'b',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'};
addEventListener('keydown',function(e){if(KM[e.key])K[KM[e.key]]=1});
addEventListener('keyup',function(e){if(KM[e.key])K[KM[e.key]]=0});
document.querySelectorAll('.pad button').forEach(function(b){
  var k=b.dataset.k;
  b.addEventListener('pointerdown',function(e){e.preventDefault();K[k]=1;b.classList.add('on')});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){b.addEventListener(n,function(){K[k]=0;b.classList.remove('on')})});
});
$('go').onclick=function(){started=true;$('title').classList.add('hide')};

/* мини-карта */
var mp=$('map'),mx=mp.getContext('2d'),MS=224,SC=MS/(HALF*2+300);
function mpx(x){return MS/2-x*SC}
function mpz(z){return MS/2-z*SC}
var bg=document.createElement('canvas');bg.width=bg.height=MS;
(function(){
  var g=bg.getContext('2d');g.fillStyle='#1b1030';g.fillRect(0,0,MS,MS);
  g.fillStyle='#2a6fb8';g.fillRect(0,0,mpx(HALF+145),MS);
  g.fillStyle='#d9b87e';g.fillRect(mpx(HALF+145),0,mpx(HALF+15)-mpx(HALF+145),MS);
  g.strokeStyle='#8a78b0';g.lineWidth=P*.25*SC*2;
  for(var j=0;j<=N;j++){g.beginPath();g.moveTo(0,mpz(rc(j)));g.lineTo(MS,mpz(rc(j)));g.stroke();g.beginPath();g.moveTo(mpx(rc(j)),0);g.lineTo(mpx(rc(j)),MS);g.stroke()}
})();

var last=0,cx0=0;
function frame(t){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(t-last)/1000||0);last=t;
  var gas=started&&K.g,brk=started&&K.b,st=started?(K.l-K.r):0;
  if(gas)car.v+=30*dt;
  if(brk)car.v-=(car.v>0?46:18)*dt;
  car.v*=1-(gas?.35:.8)*dt;
  car.v=Math.max(-14,Math.min(58,car.v));
  car.st+=(st-car.st)*Math.min(1,8*dt);
  car.a+=car.st*dt*1.9*Math.max(-1,Math.min(1,car.v/12));
  car.x+=Math.sin(car.a)*car.v*dt;car.z+=Math.cos(car.a)*car.v*dt;
  boxes.forEach(function(b){
    var dx=car.x-b.x,dz=car.z-b.z,ox=b.hw+2.1-Math.abs(dx),oz=b.hd+2.1-Math.abs(dz);
    if(ox>0&&oz>0){if(ox<oz)car.x+=ox*(dx<0?-1:1);else car.z+=oz*(dz<0?-1:1);if(Math.abs(car.v)>6)shake=Math.min(1,Math.abs(car.v)/40);car.v*=-.3}
  });
  car.x=Math.max(-HALF-60,Math.min(HALF+120,car.x));car.z=Math.max(-HALF-60,Math.min(HALF+60,car.z));
  me.position.set(car.x,0,car.z);me.rotation.y=car.a;me.rotation.z=-car.st*Math.min(1,Math.abs(car.v)/50)*.08;

  traffic.forEach(function(o){
    o.p+=o.dir*o.s*dt;if(o.p>HALF+40)o.p=-HALF-40;if(o.p<-HALF-40)o.p=HALF+40;
    if(o.ax==='z'){o.x=rc(o.j)-5*o.dir;o.z=o.p;o.m.rotation.y=o.dir>0?0:Math.PI}
    else{o.x=o.p;o.z=rc(o.j)+5*o.dir;o.m.rotation.y=o.dir>0?Math.PI/2:-Math.PI/2}
    o.m.position.set(o.x,0,o.z);
    var dx=car.x-o.x,dz=car.z-o.z,d=Math.hypot(dx,dz);
    if(d<4.2&&d>0){car.x+=dx/d*(4.2-d);car.z+=dz/d*(4.2-d);if(Math.abs(car.v)>5)shake=Math.min(1,Math.abs(car.v)/40);car.v*=-.35}
  });

  var fx=Math.sin(car.a),fz=Math.cos(car.a);
  var tx=car.x-fx*(11+car.v*.05),tz=car.z-fz*(11+car.v*.05);
  cam.position.x+=(tx-cam.position.x)*Math.min(1,5*dt);
  cam.position.z+=(tz-cam.position.z)*Math.min(1,5*dt);
  cam.position.y+=((5.2+car.v*.03)-cam.position.y)*Math.min(1,3*dt);
  shake*=1-6*dt;
  cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake*.6;
  cam.lookAt(car.x+fx*7,1.8,car.z+fz*7);
  cam.fov+=((60+Math.abs(car.v)*.35)-cam.fov)*Math.min(1,3*dt);cam.updateProjectionMatrix();
  sky.position.copy(cam.position);
  sea.material.emissiveIntensity=.45+Math.sin(t/700)*.12;

  $('spd').textContent=Math.round(Math.abs(car.v)*3.6);
  mx.drawImage(bg,0,0);
  mx.fillStyle='#ffe14d';traffic.forEach(function(o){mx.fillRect(mpx(o.x)-2,mpz(o.z)-2,4,4)});
  mx.save();mx.translate(mpx(car.x),mpz(car.z));mx.rotate(-car.a);
  mx.fillStyle='#ff3d9a';mx.strokeStyle='#fff';mx.lineWidth=2;
  mx.beginPath();mx.moveTo(0,-10);mx.lineTo(7,8);mx.lineTo(-7,8);mx.closePath();mx.fill();mx.stroke();mx.restore();
  R3.render(scene,cam);
}
cam.position.set(car.x,6,car.z-12);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
